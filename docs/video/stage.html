<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StudyHub walkthrough stage</title>
<style>
  @font-face{font-family:"Plex";src:url(/static/vendor/fonts/plex-arabic-latin-600.woff2) format("woff2");font-weight:600}
  @font-face{font-family:"Plex";src:url(/static/vendor/fonts/plex-arabic-arabic-600.woff2) format("woff2");font-weight:600;unicode-range:U+0600-06FF}
  @font-face{font-family:"Plex";src:url(/static/vendor/fonts/plex-arabic-latin-400.woff2) format("woff2");font-weight:400}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#EEF0EB;font-family:Plex,system-ui,sans-serif}
  #window{position:absolute;left:120px;top:44px;width:1680px;height:945px;border-radius:16px;overflow:hidden;background:#fff;
    box-shadow:0 30px 80px rgba(31,30,28,.18),0 0 0 1px rgba(31,30,28,.06)}
  .bar{height:40px;background:#F7F6F3;display:flex;align-items:center;gap:8px;padding:0 18px;border-bottom:1px solid #E8E6E1}
  .dot{width:12px;height:12px;border-radius:50%}
  .url{margin-inline-start:24px;background:#ECEAE5;border-radius:8px;padding:5px 16px;font-size:14px;color:#4A4843;min-width:420px}
  #viewport{position:relative;width:1680px;height:905px;overflow:hidden;background:#F7F6F3}
  #camera{position:absolute;left:0;top:0;width:1680px;height:905px;transform-origin:0 0;
    transition:transform 1.15s cubic-bezier(.65,0,.35,1);will-change:transform}
  #app{width:1680px;height:905px;border:0;display:block;background:#F7F6F3}
  #cursor{position:absolute;left:840px;top:600px;width:26px;height:26px;pointer-events:none;z-index:5;
    transition:left .7s cubic-bezier(.45,0,.2,1),top .7s cubic-bezier(.45,0,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
  #cursor svg{width:26px;height:26px}
  #ring{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #3F6E5A;opacity:0;pointer-events:none;z-index:4}
  #ring.on{animation:ring .55s ease-out}
  @keyframes ring{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(1.5)}}
  #caption{position:absolute;left:50%;bottom:64px;transform:translate(-50%,20px);opacity:0;max-width:1100px;min-width:520px;
    background:rgba(31,34,32,.93);color:#fff;border-radius:18px;padding:18px 36px 20px;text-align:center;
    transition:opacity .45s,transform .45s;z-index:10}
  #caption.on{opacity:1;transform:translate(-50%,0)}
  #caption b{display:block;font-size:38px;font-weight:600;line-height:1.25}
  #caption span{display:block;font-size:24px;opacity:.88;margin-top:6px;line-height:1.35}
  #caption .new{display:inline-block;font-size:15px;font-weight:600;background:#7DB597;color:#0E1A14;border-radius:999px;padding:2px 12px;margin-bottom:8px}
  #progress{position:absolute;left:0;bottom:0;height:6px;width:0;background:#3F6E5A;transition:width .4s linear;z-index:11}
  #card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#F7F6F3;
    z-index:20;opacity:0;pointer-events:none;transition:opacity .6s}
  #card.on{opacity:1}
  #card img{width:110px;height:110px}
  #card h1{font-size:72px;margin:0;color:#1F1E1C;font-weight:600}
  #card p{font-size:30px;margin:0;color:#4A4843;max-width:1200px;text-align:center;line-height:1.45}
  #card small{font-size:24px;color:#3F6E5A;margin-top:18px}
</style>
</head>
<body>
<div id="window">
  <div class="bar"><span class="dot" style="background:#E5675E"></span><span class="dot" style="background:#E9B949"></span><span class="dot" style="background:#5FC15F"></span><span class="url" id="url">study-joox-friends.loophole.site</span></div>
  <div id="viewport">
    <div id="camera">
      <iframe id="app" name="app" src="/"></iframe>
      <div id="ring"></div>
      <div id="cursor"><svg viewBox="0 0 24 24"><path d="M4 2l15 9.5-6.6 1.4 3.9 7.4-2.7 1.4-3.9-7.4L4 18.5z" fill="#1F1E1C" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
    </div>
  </div>
</div>
<div id="caption"></div>
<div id="progress"></div>
<div id="card"></div>
<script>
  const W = 1680, H = 905;
  const camera = document.getElementById('camera'), cursor = document.getElementById('cursor'), ring = document.getElementById('ring');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  window.stage = {
    // Move the camera so `rect` (iframe coordinates) is centred and scaled by `s` (1 = whole page).
    zoom(rect, s) {
      if (!rect || s <= 1) { camera.style.transform = 'translate(0px,0px) scale(1)'; return; }
      s = Math.max(1, Math.min(s, W * 0.94 / rect.width, H * 0.86 / rect.height));   // never crop what we zoom on
      const cx = rect.x + rect.width / 2, cy = rect.y + rect.height / 2;
      const tx = Math.min(0, Math.max(W - W * s, W / 2 - cx * s)), ty = Math.min(0, Math.max(H - H * s, H / 2 - cy * s));
      camera.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
    },
    point(x, y) { cursor.style.left = (x - 4) + 'px'; cursor.style.top = (y - 2) + 'px'; },
    click(x, y) { ring.style.left = x + 'px'; ring.style.top = y + 'px'; ring.classList.remove('on'); void ring.offsetWidth; ring.classList.add('on'); },
    cursor(show) { cursor.style.opacity = show ? 1 : 0; },
    caption(title, sub, isNew) {
      const box = document.getElementById('caption');
      if (!title) { box.classList.remove('on'); return; }
      box.innerHTML = (isNew ? `<div class="new">${esc(isNew)}</div>` : '') + `<b>${esc(title)}</b>` + (sub ? `<span>${esc(sub)}</span>` : '');
      box.classList.add('on');
    },
    progress(fraction) { document.getElementById('progress').style.width = (fraction * 100).toFixed(2) + '%'; },
    card(html) { const c = document.getElementById('card'); if (html) { c.innerHTML = html; c.classList.add('on'); } else c.classList.remove('on'); },
    url(text) { document.getElementById('url').textContent = text; },
  };
</script>
</body>
</html>
